# Air 监听 Go 源码并重启宿主机 API，开发环境不再构建 new-api 容器。
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/new-api ."
  bin = "tmp/new-api"
  full_bin = "./tmp/new-api --log-dir ./logs"
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "web/node_modules", "web/dist", ".git"]
  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = true

[misc]
  clean_on_exit = false
