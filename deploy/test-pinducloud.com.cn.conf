server {
    listen 80;
    listen [::]:80;
    server_name test.pinducloud.com.cn;

    client_max_body_size 64m;

    access_log /var/log/nginx/new-api-domain-access.log timed;
    error_log /var/log/nginx/new-api-domain-error.log warn;

    # 保留 ACME 校验目录，续期时无需暂停站点。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test.pinducloud.com.cn;

    client_max_body_size 64m;

    access_log /var/log/nginx/new-api-domain-ssl-access.log timed;
    error_log /var/log/nginx/new-api-domain-ssl-error.log warn;

    ssl_certificate /etc/letsencrypt/live/test.pinducloud.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.pinducloud.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API、Relay 和临时素材地址进入 Air 后端。
    location ~ ^/(api|v1|v1beta|pg|mj|suno|kling|jimeng)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;

        proxy_connect_timeout 60s;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        send_timeout 1200s;
    }

    # 其余请求进入 Rsbuild，支持页面热更新和 HMR WebSocket。
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
